[project]
name = "sensex-ip-strategy"
version = "0.1.0"
description = "BSE Sensex Ideal Premium strategy using BSE India market data"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "pyyaml>=6.0",
    "apscheduler>=3.10.0",
    "pyperclip>=1.9.0",
    "bse>=3.3.0",
    "requests>=2.28.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
sensex-ip = "sensex_ip.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
