[project]
name = "mcx-ip-strategy"
version = "0.1.0"
description = "MCX Natural Gas Ideal Premium strategy"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "pyyaml>=6.0",
    "apscheduler>=3.10.0",
    "pyperclip>=1.9.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
mcx-ip = "mcx_ip.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
