interval_minutes: 5
underlying: ETH
perp_symbol: ETHUSD
premium_field: mark_price
daily_low_mode: current_session
# Delta testnet (Demo account) API base - keys must be generated at
# https://demo.delta.exchange/ (separate signup from the live account).
delta_base_url: https://cdn-ind.testnet.deltaex.org
output_dir: output/testnet
preserve_levels_on_failure: true
candle_request_delay_seconds: 0.15
bridge_host: 127.0.0.1
bridge_port: 8766
auto_clipboard: false
order_flow_enabled: false

# Auto-trading against testnet - enabled here since this config only ever
# points at fake testnet money. Credentials still come from env vars only.
trading_enabled: true
trading_leverage: 25
trading_capital_fraction: 0.25
trading_entry_offsets: [2.0, 8.0, 18.0, 28.0]
trading_tp_offset: 2.0
trading_poll_minutes: 5
